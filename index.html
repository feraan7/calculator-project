
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #151b35;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 350px;
            padding: 30px;
            background: #6475c4;
            border-radius: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }

        .header h2 {
            font-size: 18px;
        }

        .theme {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }

        .theme span {
            cursor: pointer;
        }

        .display {
            width: 100%;
            height: 65px;
            margin-bottom: 15px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            border-radius: 6px;
            background: #172344;
            color: white;
            font-size: 28px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 12px;
            background: #42569b;
            border-radius: 8px;
        }

        .btn {
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            color: #25304d;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 3px #c6c6c6;
        }

        .delete {
            background: #9bafd9;
            color: white;
            box-shadow: 0 3px #748bb9;
        }

        .reset {
            grid-column: span 2;
            background: #819fe5;
            color: white;
            box-shadow: 0 3px #657ebd;
        }

        .equal {
            grid-column: span 2;
            background: #f08068;
            color: white;
            box-shadow: 0 3px #ce6754;
        }

        @media (max-width: 400px) {
            .calculator {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="header">
            <h2>calc</h2>

            <div class="theme">
                THEME
                <span>1</span>
                <span>2</span>
                <span>3</span>
            </div>
        </div>

        <div class="display" id="display"></div>

        <div class="buttons">

            <div  class="btn" onclick="appendvalue('7')">7</div>
            <div class="btn" onclick="appendvalue('8')">8</div>
            <div class="btn" onclick="appendvalue('9')">9</div>
            <div class="btn delete" onclick="deleteLast()">DEL</div>

            <div class="btn" onclick="appendvalue('4')">4</div>
            <div class="btn" onclick="appendvalue('5')">5</div>
            <div class="btn" onclick="appendvalue('6')">6</div>
            <div class="btn" onclick="appendvalue('+')">+</div>

            <div class="btn" onclick="appendvalue('1')">1</div>
            <div class="btn" onclick="appendvalue('2')">2</div>
            <div class="btn" onclick="appendvalue('3')">3</div>
            <div class="btn" onclick="appendvalue('-')">-</div>

            <div class="btn" onclick="appendvalue('.')">.</div>
            <div class="btn" onclick="appendvalue('0')">0</div>
            <div class="btn" onclick="appendvalue('/')">/</div>
            <div class="btn" onclick="appendvalue('*')">×</div>

            <div class="btn reset" onclick="reset()">RESET</div>
            <div class="btn equal" onclick="calculate()">=</div>

        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
